---
name: Mainline Version
on:
  workflow_call:
    inputs:
      version:
        description: 'Kernel minor version, e.g. v6.17.'
        type: string
        required: true
      revisions:
        description:
          'The revision info map under the minor version being built.'
        type: string
        required: true

permissions:
  contents: read

env:
  DOCKER_REPO: vicamo/ubuntu-mainline-kernels

jobs:
  transform:
    name: Transform input values
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.transform.outputs.architectures }}
    env:
      INPUT_REVISIONS: ${{ inputs.revisions }}
    steps:
      - id: transform
        run: |
          platforms_json='[
            ["amd64", "linux/amd64"],
            ["arm64", "linux/arm64"],
            ["armhf", "linux/arm/v7"],
            ["i386", "linux/386"],
            ["powerpc", "linux/ppc"],
            ["ppc64el", "linux/ppc64le"],
            ["riscv64", "linux/riscv64"],
            ["s390x", "linux/s390x"]
          ]'

          arch_json="$(echo "${INPUT_REVISIONS}" |
              jq -c -M '[.[] | .architectures[]] | unique | map({
                  "arch":.,
                  "platform":(. as $arch | '"${platforms_json}"' |
                              map(select(.[0] == $arch))[0][1])
                })
              ')"

          echo "::group::All available architectures"
          echo "${arch_json}" | jq -M
          echo "::endgroup::"

          { \
            echo "architectures=${arch_json}"; \
          } | tee -a "${GITHUB_OUTPUT}"

  build:
    name: ${{ format('build-{}-{}', inputs.version, matrix.arch) }}
    runs-on: ubuntu-latest
    needs:
      - transform
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.transform.outputs.architectures) }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build deb archive image
        run: |
          echo "true".
